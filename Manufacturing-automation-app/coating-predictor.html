<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IQ-EL Coating Predictor</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 968px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .card h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5rem;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            color: #555;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .input-group .unit {
            font-size: 0.85rem;
            color: #888;
            margin-top: 4px;
        }

        .predict-button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        .predict-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .predict-button:active {
            transform: translateY(0);
        }

        .output-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .output-item {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .output-item.warning {
            border-left-color: #ff6b6b;
            background: #fff5f5;
        }

        .output-item.success {
            border-left-color: #51cf66;
            background: #f0fdf4;
        }

        .output-item h3 {
            color: #555;
            font-size: 0.9rem;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .output-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: #333;
            margin-bottom: 5px;
        }

        .output-uncertainty {
            font-size: 0.9rem;
            color: #888;
        }

        .placeholder-text {
            text-align: center;
            color: #999;
            padding: 40px 20px;
            font-style: italic;
        }

        .quality-indicator {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-weight: 600;
        }

        .quality-indicator.good {
            background: #d3f9d8;
            color: #2b8a3e;
        }

        .quality-indicator.moderate {
            background: #fff3bf;
            color: #f08c00;
        }

        .quality-indicator.poor {
            background: #ffe3e3;
            color: #c92a2a;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function CoatingPredictor() {
            const [inputs, setInputs] = useState({
                eta1: '',
                eta1000: '',
                SC: '',
                U: '',
                G: '',
                pump: ''
            });

            const [predictions, setPredictions] = useState(null);

            const inputFields = [
                { key: 'eta1', label: 'Viscosity at 1/s (η₁)', unit: 'Pa·s', placeholder: '2.5' },
                { key: 'eta1000', label: 'Viscosity at 1000/s (η₁₀₀₀)', unit: 'Pa·s', placeholder: '1.2' },
                { key: 'SC', label: 'Solid Content', unit: 'mass %', placeholder: '45.0' },
                { key: 'U', label: 'Speed / Velocity', unit: 'm/min', placeholder: '10.0' },
                { key: 'G', label: 'Gap / Distance', unit: 'µm', placeholder: '150.0' },
                { key: 'pump', label: 'Pump Rate', unit: 'U/min', placeholder: '25.0' }
            ];

            const handleInputChange = (key, value) => {
                setInputs(prev => ({
                    ...prev,
                    [key]: value
                }));
            };

            const handlePredict = () => {
                // Validate inputs
                const allFilled = Object.values(inputs).every(val => val !== '');
                if (!allFilled) {
                    alert('Please fill in all input fields');
                    return;
                }

                // Generate dummy predictions
                const dummyPredictions = {
                    h_mean_pred: (45.2 + Math.random() * 10).toFixed(2),
                    h_mean_std: (2.1 + Math.random() * 0.5).toFixed(2),
                    super_elev_pred: (3.5 + Math.random() * 2).toFixed(2),
                    super_elev_std: (1.8 + Math.random() * 0.4).toFixed(2)
                };

                setPredictions(dummyPredictions);
            };

            const getQualityStatus = () => {
                if (!predictions) return null;
                
                const superElev = parseFloat(predictions.super_elev_pred);
                if (superElev < 2) return 'good';
                if (superElev < 5) return 'moderate';
                return 'poor';
            };

            const getQualityMessage = () => {
                const status = getQualityStatus();
                if (status === 'good') return '✓ Excellent Quality - Low Edge Elevation';
                if (status === 'moderate') return '⚠ Moderate Quality - Some Edge Elevation';
                return '✗ Poor Quality - High Edge Elevation Defect';
            };

            return (
                <div className="container">
                    <div className="header">
                        <h1>IQ-EL Coating Predictor</h1>
                        <p>Manufacturing Process Quality Prediction</p>
                    </div>

                    <div className="main-content">
                        {/* Input Section */}
                        <div className="card">
                            <h2>Input Parameters</h2>
                            {inputFields.map(field => (
                                <div key={field.key} className="input-group">
                                    <label>{field.label}</label>
                                    <input
                                        type="number"
                                        step="0.01"
                                        placeholder={field.placeholder}
                                        value={inputs[field.key]}
                                        onChange={(e) => handleInputChange(field.key, e.target.value)}
                                    />
                                    <div className="unit">{field.unit}</div>
                                </div>
                            ))}
                            <button className="predict-button" onClick={handlePredict}>
                                Predict Coating Quality
                            </button>
                        </div>

                        {/* Output Section */}
                        <div className="card">
                            <h2>Predictions</h2>
                            {predictions ? (
                                <>
                                    <div className="output-grid">
                                        <div className="output-item success">
                                            <h3>Mean Coating Thickness (h_mean)</h3>
                                            <div className="output-value">{predictions.h_mean_pred} µm</div>
                                            <div className="output-uncertainty">± {predictions.h_mean_std} µm</div>
                                        </div>
                                        <div className="output-item">
                                            <h3>Thickness Uncertainty</h3>
                                            <div className="output-value">{predictions.h_mean_std} µm</div>
                                            <div className="output-uncertainty">Standard Deviation</div>
                                        </div>
                                        <div className="output-item warning">
                                            <h3>Edge Elevation (super_elev)</h3>
                                            <div className="output-value">{predictions.super_elev_pred} µm</div>
                                            <div className="output-uncertainty">± {predictions.super_elev_std} µm</div>
                                        </div>
                                        <div className="output-item">
                                            <h3>Elevation Uncertainty</h3>
                                            <div className="output-value">{predictions.super_elev_std} µm</div>
                                            <div className="output-uncertainty">Standard Deviation</div>
                                        </div>
                                    </div>
                                    <div className={`quality-indicator ${getQualityStatus()}`}>
                                        {getQualityMessage()}
                                    </div>
                                </>
                            ) : (
                                <div className="placeholder-text">
                                    Enter input parameters and click "Predict Coating Quality" to see results
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<CoatingPredictor />);
    </script>
</body>
</html>
